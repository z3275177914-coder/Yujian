name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build debug
        run: swift build -c debug

      - name: Run unit tests
        run: swift test

      - name: Check scripts and release contracts
        run: |
          zsh -n Scripts/*.sh
          rg -q 'Scripts/package-release.sh' Sources Scripts Docs
          rg -q 'Scripts/verify-release-app.sh' Sources Scripts Docs
          git diff --check
